<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelFlick - Gesture Playground & Test Studio</title>
  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border: rgba(99, 102, 241, 0.25);
      --accent: #6366f1;
      --accent-cyan: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0d1527 0%, var(--bg) 90%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feed-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #03060c;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .feedback-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(0.85);
    }

    .feedback-overlay.active {
      opacity: 1;
      transform: scale(1);
    }

    .feedback-icon {
      font-size: 52px;
      filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.9));
    }

    .feedback-text {
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    .feed-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .feed-placeholder.hidden {
      display: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.6);
    }

    /* Simulated Reels Deck */
    .reels-simulator {
      position: relative;
      height: 380px;
      background: #020408;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reel-card {
      width: 90%;
      height: 90%;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }

    .reel-1 { background: linear-gradient(135deg, #1e1b4b, #312e81); }
    .reel-2 { background: linear-gradient(135deg, #064e3b, #047857); }
    .reel-3 { background: linear-gradient(135deg, #701a75, #86198f); }
    .reel-4 { background: linear-gradient(135deg, #7c2d12, #9a3412); }

    .reel-title {
      font-size: 18px;
      font-weight: 700;
    }

    .reel-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .like-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .like-badge.liked {
      background: #ef4444;
      color: white;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
    }

    .log-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #94a3b8;
      max-height: 100px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-entry.highlight {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">⚡</div>
        <div>
          <h1>ReelFlick Gesture Playground</h1>
          <p>Real-Time In-Browser Test Studio</p>
        </div>
      </div>
      <button class="btn-primary" id="btn-toggle-cam">Start Camera</button>
    </header>

    <div class="grid">
      <!-- Left: Camera & Vision Feed -->
      <div class="card">
        <h2 style="font-size: 14px; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.5px;">1. Camera Vision & Gesture Feed</h2>
        
        <div class="feed-container">
          <video id="test-video" playsinline muted autoplay></video>
          <canvas id="test-canvas"></canvas>
          <div class="feedback-overlay" id="feedback-overlay">
            <span class="feedback-icon" id="feedback-icon">⚡</span>
            <span class="feedback-text" id="feedback-text">Flick Up</span>
          </div>
          <div class="feed-placeholder" id="placeholder">
            <span>📷 Camera is offline</span>
            <button class="btn-primary" id="btn-start-hero">Allow & Start Camera</button>
          </div>
        </div>

        <div class="log-box" id="log-box">
          <div class="log-entry">Studio ready. Click 'Start Camera' to calibrate.</div>
        </div>
      </div>

      <!-- Right: Simulated Short-form Video Feed -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px;">2. Interactive Video Deck</h2>
          <span style="font-size: 11px; color: var(--text-muted);" id="deck-counter">Reel 1 of 4</span>
        </div>

        <div class="reels-simulator" id="reels-deck">
          <div class="reel-card reel-1" id="current-reel">
            <div>
              <div style="font-size: 11px; opacity: 0.7; margin-bottom: 4px;">#1 • ReelFlick Demo</div>
              <div class="reel-title" id="reel-title">Wave Up 🖐️⬆️ to go to next video</div>
            </div>
            <div class="reel-stats">
              <div class="like-badge" id="like-badge">
                <span id="heart-icon">🤍</span>
                <span id="like-count">1.4k</span>
              </div>
              <span id="play-status">▶ Playing</span>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 8px; justify-content: center;">
          <button class="btn-primary" style="padding: 6px 14px; font-size: 11px;" id="btn-prev">⬆ Prev Reel</button>
          <button class="btn-primary" style="padding: 6px 14px; font-size: 11px;" id="btn-next">⬇ Next Reel</button>
          <button class="btn-primary" style="padding: 6px 14px; font-size: 11px; background: #ef4444;" id="btn-like">❤️ Like</button>
        </div>
      </div>
    </div>
  </div>

  <script src="content/platform_adapter.js"></script>
  <script src="content/gesture_engine.js"></script>
  <script src="content/tracker.js"></script>
  <script>
    const reelsData = [
      { id: 1, title: "Wave Up 🖐️⬆️ to go to next video", bg: "reel-1", likes: 1420 },
      { id: 2, title: "Hold Thumbs Up 👍 to like this reel", bg: "reel-2", likes: 3890 },
      { id: 3, title: "Wave Down 👇⬇️ to go back to previous", bg: "reel-3", likes: 9200 },
      { id: 4, title: "ReelFlick extension fully loaded!", bg: "reel-4", likes: 15400 }
    ];

    let currentIndex = 0;
    let isLiked = false;
    let isPlaying = true;

    const video = document.getElementById("test-video");
    const canvas = document.getElementById("test-canvas");
    const placeholder = document.getElementById("placeholder");
    const btnToggleCam = document.getElementById("btn-toggle-cam");
    const btnStartHero = document.getElementById("btn-start-hero");
    const feedbackOverlay = document.getElementById("feedback-overlay");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackText = document.getElementById("feedback-text");
    const logBox = document.getElementById("log-box");

    const currentReel = document.getElementById("current-reel");
    const reelTitle = document.getElementById("reel-title");
    const deckCounter = document.getElementById("deck-counter");
    const likeBadge = document.getElementById("like-badge");
    const heartIcon = document.getElementById("heart-icon");
    const likeCount = document.getElementById("like-count");
    const playStatus = document.getElementById("play-status");

    function log(msg, isHighlight = false) {
      const entry = document.createElement("div");
      entry.className = `log-entry ${isHighlight ? 'highlight' : ''}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function renderReel() {
      const reel = reelsData[currentIndex];
      currentReel.className = `reel-card ${reel.bg}`;
      reelTitle.textContent = reel.title;
      deckCounter.textContent = `Reel ${currentIndex + 1} of ${reelsData.length}`;
      isLiked = false;
      likeBadge.classList.remove("liked");
      heartIcon.textContent = "🤍";
      likeCount.textContent = reel.likes;
    }

    function nextReel() {
      currentIndex = (currentIndex + 1) % reelsData.length;
      renderReel();
      log(`Swiped Next ➔ Reel #${currentIndex + 1}`, true);
      showFeedback("⬇️", "Next Reel");
    }

    function prevReel() {
      currentIndex = (currentIndex - 1 + reelsData.length) % reelsData.length;
      renderReel();
      log(`Swiped Prev ➔ Reel #${currentIndex + 1}`, true);
      showFeedback("⬆️", "Previous Reel");
    }

    function toggleLike() {
      isLiked = !isLiked;
      if (isLiked) {
        likeBadge.classList.add("liked");
        heartIcon.textContent = "❤️";
        likeCount.textContent = reelsData[currentIndex].likes + 1;
        log(`Liked Reel #${currentIndex + 1} ❤️`, true);
        showFeedback("❤️", "Liked Reel!");
      } else {
        likeBadge.classList.remove("liked");
        heartIcon.textContent = "🤍";
        likeCount.textContent = reelsData[currentIndex].likes;
      }
    }

    let feedbackTimer = null;
    function showFeedback(icon, text) {
      feedbackIcon.textContent = icon;
      feedbackText.textContent = text;
      feedbackOverlay.classList.add("active");
      if (feedbackTimer) clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => {
        feedbackOverlay.classList.remove("active");
      }, 700);
    }

    document.getElementById("btn-next").addEventListener("click", nextReel);
    document.getElementById("btn-prev").addEventListener("click", prevReel);
    document.getElementById("btn-like").addEventListener("click", toggleLike);

    // Initialize Engine & Tracker
    const gestureEngine = new window.ReelFlickGestureEngine({ mode: "full_gestures", sensitivity: 1.3 });
    const tracker = new window.ReelFlickHandTracker(video, canvas, (landmarks) => {
      if (!landmarks) return;
      const res = gestureEngine.process(landmarks);
      if (res && res.action) {
        if (res.action === "NEXT") nextReel();
        if (res.action === "PREVIOUS") prevReel();
        if (res.action === "LIKE") toggleLike();
      }
    });

    async function toggleCamera() {
      if (tracker.isRunning) {
        tracker.stop();
        placeholder.classList.remove("hidden");
        btnToggleCam.textContent = "Start Camera";
        log("Camera stream stopped.");
      } else {
        try {
          await tracker.start();
          placeholder.classList.add("hidden");
          btnToggleCam.textContent = "Stop Camera";
          log("Camera started! Vision tracking active.");
        } catch (e) {
          log("Camera permission denied or unavailable: " + e.message);
        }
      }
    }

    btnToggleCam.addEventListener("click", toggleCamera);
    btnStartHero.addEventListener("click", toggleCamera);
  </script>
</body>
</html>
