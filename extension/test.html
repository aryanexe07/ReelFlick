<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelFlick - Gesture Studio</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #ffffff;
      --accent-muted: #71717a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top center, #18181b 0%, var(--bg) 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 880px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .brand p {
      font-size: 11px;
      color: var(--accent-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .feed-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.5;
      filter: grayscale(80%) contrast(1.15);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .feedback-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 14, 0.9);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(0.85);
    }

    .feedback-overlay.active {
      opacity: 1;
      transform: scale(1);
    }

    .feedback-icon {
      font-size: 48px;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.8));
    }

    .feedback-text {
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
    }

    .feed-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--accent-muted);
    }

    .feed-placeholder.hidden {
      display: none;
    }

    .btn-primary {
      background: #ffffff;
      color: #09090b;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.15s ease;
    }

    .btn-primary:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }

    .btn-dark {
      background: #1e1e24;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-dark:hover {
      background: #27272a;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Simulated Reels Deck */
    .reels-simulator {
      position: relative;
      height: 360px;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reel-card {
      width: 90%;
      height: 90%;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reel-1 { background: linear-gradient(135deg, #18181b, #0f0f12); }
    .reel-2 { background: linear-gradient(135deg, #202024, #121215); }
    .reel-3 { background: linear-gradient(135deg, #1c1c20, #0d0d0f); }
    .reel-4 { background: linear-gradient(135deg, #27272a, #18181b); }

    .reel-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .reel-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .like-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .like-badge.liked {
      background: #ffffff;
      color: #09090b;
      font-weight: 600;
    }

    .log-box {
      background: #09090b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: var(--accent-muted);
      max-height: 90px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 3px;
    }

    .log-entry.highlight {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">
          <img src="icons/icon48.png" alt="ReelFlick">
        </div>
        <div>
          <h1>ReelFlick Gesture Studio</h1>
          <p>Real-Time In-Browser Test Environment</p>
        </div>
      </div>
      <button class="btn-primary" id="btn-toggle-cam">Start Camera</button>
    </header>

    <div class="grid">
      <!-- Left: Camera & Vision Feed -->
      <div class="card">
        <h2 style="font-size: 12.5px; color: var(--accent-muted); text-transform: uppercase; letter-spacing: 0.6px;">1. Hand Vision & Landmarks</h2>
        
        <div class="feed-container">
          <video id="test-video" playsinline muted autoplay></video>
          <canvas id="test-canvas"></canvas>
          <div class="feedback-overlay" id="feedback-overlay">
            <span class="feedback-icon" id="feedback-icon">⚡</span>
            <span class="feedback-text" id="feedback-text">Flick Up</span>
          </div>
          <div class="feed-placeholder" id="placeholder">
            <span>📷 Camera is offline</span>
            <button class="btn-primary" id="btn-start-hero">Start Camera</button>
          </div>
        </div>

        <div class="log-box" id="log-box">
          <div class="log-entry">Studio ready. Wave or snap wrist up/down to flick.</div>
        </div>
      </div>

      <!-- Right: Simulated Short-form Video Feed -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 12.5px; color: var(--accent-muted); text-transform: uppercase; letter-spacing: 0.6px;">2. Video Feed Preview</h2>
          <span style="font-size: 11px; color: var(--accent-muted);" id="deck-counter">Reel 1 of 4</span>
        </div>

        <div class="reels-simulator" id="reels-deck">
          <div class="reel-card reel-1" id="current-reel">
            <div>
              <div style="font-size: 11px; opacity: 0.6; margin-bottom: 4px;">#1 • ReelFlick Preview</div>
              <div class="reel-title" id="reel-title">Sharp Flick Up 🖐️⬆️ to go to next video</div>
            </div>
            <div class="reel-stats">
              <div class="like-badge" id="like-badge">
                <span id="heart-icon">🤍</span>
                <span id="like-count">1.4k</span>
              </div>
              <span id="play-status" style="font-size: 11px; opacity: 0.7;">▶ Playing</span>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 8px; justify-content: center;">
          <button class="btn-dark" id="btn-prev">⬆ Prev Reel</button>
          <button class="btn-dark" id="btn-next">⬇ Next Reel</button>
          <button class="btn-dark" id="btn-like">❤️ Like</button>
        </div>
      </div>
    </div>
  </div>

  <script src="lib/hands.js"></script>
  <script src="content/platform_adapter.js"></script>
  <script src="content/gesture_engine.js"></script>
  <script src="content/tracker.js"></script>
  <script>
    const reelsData = [
      { id: 1, title: "Sharp Flick Up 🖐️⬆️ to go to next video", bg: "reel-1", likes: 1420 },
      { id: 2, title: "Hold Thumbs Up 👍 to like this reel", bg: "reel-2", likes: 3890 },
      { id: 3, title: "Sharp Flick Down 👇⬇️ to go to previous", bg: "reel-3", likes: 9200 },
      { id: 4, title: "Matte Charcoal Noir theme active", bg: "reel-4", likes: 15400 }
    ];

    let currentIndex = 0;
    let isLiked = false;

    const video = document.getElementById("test-video");
    const canvas = document.getElementById("test-canvas");
    const placeholder = document.getElementById("placeholder");
    const btnToggleCam = document.getElementById("btn-toggle-cam");
    const btnStartHero = document.getElementById("btn-start-hero");
    const feedbackOverlay = document.getElementById("feedback-overlay");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackText = document.getElementById("feedback-text");
    const logBox = document.getElementById("log-box");

    const currentReel = document.getElementById("current-reel");
    const reelTitle = document.getElementById("reel-title");
    const deckCounter = document.getElementById("deck-counter");
    const likeBadge = document.getElementById("like-badge");
    const heartIcon = document.getElementById("heart-icon");
    const likeCount = document.getElementById("like-count");

    function log(msg, isHighlight = false) {
      const entry = document.createElement("div");
      entry.className = `log-entry ${isHighlight ? 'highlight' : ''}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function renderReel() {
      const reel = reelsData[currentIndex];
      currentReel.className = `reel-card ${reel.bg}`;
      reelTitle.textContent = reel.title;
      deckCounter.textContent = `Reel ${currentIndex + 1} of ${reelsData.length}`;
      isLiked = false;
      likeBadge.classList.remove("liked");
      heartIcon.textContent = "🤍";
      likeCount.textContent = reel.likes;
    }

    function nextReel() {
      currentIndex = (currentIndex + 1) % reelsData.length;
      renderReel();
      log(`Flick Next ➔ Reel #${currentIndex + 1}`, true);
      showFeedback("⬇️", "Next Reel");
    }

    function prevReel() {
      currentIndex = (currentIndex - 1 + reelsData.length) % reelsData.length;
      renderReel();
      log(`Flick Prev ➔ Reel #${currentIndex + 1}`, true);
      showFeedback("⬆️", "Previous Reel");
    }

    function toggleLike() {
      isLiked = !isLiked;
      if (isLiked) {
        likeBadge.classList.add("liked");
        heartIcon.textContent = "❤️";
        likeCount.textContent = reelsData[currentIndex].likes + 1;
        log(`Liked Reel #${currentIndex + 1} ❤️`, true);
        showFeedback("❤️", "Liked Reel!");
      } else {
        likeBadge.classList.remove("liked");
        heartIcon.textContent = "🤍";
        likeCount.textContent = reelsData[currentIndex].likes;
      }
    }

    let feedbackTimer = null;
    function showFeedback(icon, text) {
      feedbackIcon.textContent = icon;
      feedbackText.textContent = text;
      feedbackOverlay.classList.add("active");
      if (feedbackTimer) clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => {
        feedbackOverlay.classList.remove("active");
      }, 700);
    }

    document.getElementById("btn-next").addEventListener("click", nextReel);
    document.getElementById("btn-prev").addEventListener("click", prevReel);
    document.getElementById("btn-like").addEventListener("click", toggleLike);

    const gestureEngine = new window.ReelFlickGestureEngine({ mode: "full_gestures", sensitivity: 1.2 });
    const tracker = new window.ReelFlickHandTracker(video, canvas, (landmarks) => {
      if (!landmarks) return;
      const res = gestureEngine.process(landmarks);
      if (res && res.action) {
        if (res.action === "NEXT") nextReel();
        if (res.action === "PREVIOUS") prevReel();
        if (res.action === "LIKE") toggleLike();
      }
    });

    async function toggleCamera() {
      if (tracker.isRunning) {
        tracker.stop();
        placeholder.classList.remove("hidden");
        btnToggleCam.textContent = "Start Camera";
        log("Camera stopped.");
      } else {
        try {
          await tracker.start();
          placeholder.classList.add("hidden");
          btnToggleCam.textContent = "Stop Camera";
          log("Camera & Hand tracking active!");
        } catch (e) {
          log("Camera error: " + e.message);
        }
      }
    }

    btnToggleCam.addEventListener("click", toggleCamera);
    btnStartHero.addEventListener("click", toggleCamera);
  </script>
</body>
</html>
